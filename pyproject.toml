[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mpro-digital-twins"
version = "0.2.0"
description = "Academic digital twins of Metalyte PRO-MPRO Configuration 2: chemical twin, software twin and twin services"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
app = ["streamlit>=1.36,<2"]
study = ["matplotlib>=3.8"]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mpro = ["baseline.json"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
