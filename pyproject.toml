[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "metalyte-pro-mpro"
version = "0.1.0"
description = "Academic Tier-0 software concept demonstrator for Metalyte PRO-MPRO"
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.36,<2",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<9",
]

[tool.setuptools.packages.find]
where = ["software_demo"]
include = ["metalyte*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["software_demo/tests"]
pythonpath = ["software_demo"]

